name: Code Quality Checks

on:
  push:
    tags:
        - '**'

jobs:
  code-quality:
    name: Run Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'
          
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
  
      - name: Run lint
        run: npm run lint